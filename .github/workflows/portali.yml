name: Calendari portali

# Legge i calendari iCal di Booking.com e Airbnb e aggiorna
# data/portali_occupati.json con le sole date occupate.
# I link stanno nel segreto ICAL_SOURCES, mai nel repository.

on:
  schedule:
    - cron: "17 */3 * * *"   # ogni 3 ore
  workflow_dispatch:          # esecuzione manuale dalla scheda Actions

permissions:
  contents: write

concurrency:
  group: portali
  cancel-in-progress: false

jobs:
  aggiorna:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main   # sempre l'ultima versione, anche quando si rilancia un'esecuzione vecchia

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Leggi i calendari dei portali
        env:
          # Accetta il segreto con entrambi i nomi: quello vuoto non aggiunge nulla.
          ICAL_SOURCES: ${{ secrets.ICAL_SOURCES }}${{ secrets.ICAL_SOURCE }}
        run: python3 tools/fetch_portali.py

      - name: Pubblica le date occupate
        run: |
          if [ -n "$(git status --porcelain data/portali_occupati.json)" ]; then
            git config user.name  "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/portali_occupati.json
            git commit -m "Date occupate dai portali: $(date -u '+%Y-%m-%d %H:%M UTC')"
            # Se nel frattempo qualcuno ha pubblicato (es. SINCRONIZZA PLANNER), riallinea e riprova.
            for tentativo in 1 2 3; do
              git pull --rebase -X theirs origin main && git push && exit 0
              sleep 5
            done
            exit 1
          else
            echo "Nessuna variazione."
          fi
